<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Manager — Baseball Team App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <span class="nav-logo">⚾</span>
      <span class="nav-title" id="nav-team-name">Diamond Manager</span>
    </div>
    <div class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-view="dashboard">Dashboard</button>
      <button class="nav-tab" data-view="comms">Communications</button>
      <button class="nav-tab" data-view="practices">Practice Plans</button>
      <button class="nav-tab" data-view="lineup">Lineup Manager</button>
      <button class="nav-tab" data-view="roster">Roster</button>
      <button class="nav-tab" data-view="settings">Settings</button>
    </div>
    <button class="nav-menu-btn" id="nav-menu-btn">☰</button>
  </nav>
  <div class="nav-mobile-menu hidden" id="nav-mobile-menu">
    <button class="mobile-tab" data-view="dashboard">📊 Dashboard</button>
    <button class="mobile-tab" data-view="comms">💬 Communications</button>
    <button class="mobile-tab" data-view="practices">📋 Practice Plans</button>
    <button class="mobile-tab" data-view="lineup">⚾ Lineup Manager</button>
    <button class="mobile-tab" data-view="roster">👥 Roster</button>
    <button class="mobile-tab" data-view="settings">⚙️ Settings</button>
  </div>
  <main class="main-content" id="main-content">
    <!-- Views rendered by JavaScript -->
  </main>
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
